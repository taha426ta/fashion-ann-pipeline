preprocess:
  test_size: 0.1      # fraction of the training set held out for validation
  seed: 42
  normalization: minmax   # minmax -> [0, 1] | standard -> z-score | symmetric -> [-1, 1]

train:
  dense_units: 256
  dropout_rate: 0.2
  learning_rate: 0.001
  epochs: 10
  batch_size: 64
  seed: 42
